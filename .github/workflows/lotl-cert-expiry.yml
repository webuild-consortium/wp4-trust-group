name: LoTL certificate expiry

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    env:
      LOTL_SIGNING_CERT: ${{ secrets.LOTL_SIGNING_CERT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check certificates in tl_entries and the published LoTL
        run: |
          python -m tools.lotl --check-expiry \
            --tl-entries-dir lotl/tl_entries/ \
            --lotl-json https://webuild-consortium.github.io/wp4-trust-group/list_of_trusted_lists.json
